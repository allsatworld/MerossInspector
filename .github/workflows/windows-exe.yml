name: Compilar Meross Inspector Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar PyInstaller
        run: python -m pip install pyinstaller==6.16.0

      - name: Crear EXE portatil
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MerossInspector meross_inspector.py

      - name: Publicar EXE
        uses: actions/upload-artifact@v4
        with:
          name: MerossInspector-Windows-EXE
          path: dist/MerossInspector.exe
          if-no-files-found: error
